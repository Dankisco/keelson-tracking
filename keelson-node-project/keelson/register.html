{% extends "base.html" %}
{% block title %}Open an account &mdash; Keelson{% endblock %}

{% block content %}
<section class="wrap split">
  <div class="card">
    <h1 style="font-size:clamp(1.6rem,1.2rem+1.4vw,2.1rem)">Open an account</h1>
    <p style="color:var(--ink-2);margin-top:8px">Book freight and track every leg from one place.</p>

    <form method="post" class="stack" style="margin-top:22px">
      <label class="field"><span>Your name</span>
        <input name="name" required autocomplete="name" value="{{ form.name or '' }}"></label>
      <label class="field"><span>Company</span>
        <input name="company" autocomplete="organization" value="{{ form.company or '' }}"></label>
      <label class="field"><span>Email</span>
        <input name="email" type="email" required autocomplete="email"
               value="{{ form.email or '' }}"></label>
      <label class="field"><span>Password</span>
        <input name="password" type="password" required minlength="8" autocomplete="new-password">
      </label>
      <button class="btn btn-accent btn-wide" type="submit">Open account</button>
    </form>

    <p style="margin:18px 0 0;font-size:.92rem;color:var(--ink-2)">
      Already with us? <a href="/login">Sign in</a>.</p>
  </div>

  <div class="mapframe">
    <div class="mapstage">{% include "partials/worldmap.html" %}</div>
  </div>
</section>
{% endblock %}
